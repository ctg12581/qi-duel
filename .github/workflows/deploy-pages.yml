name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_NAME: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_NAME}"
          curl -fL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_NAME}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GD_BIN=$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*linux*' | head -n1)
          chmod +x "$GD_BIN"
          echo "GODOT_BIN=$GD_BIN" >> "$GITHUB_ENV"

          curl -fL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_NAME}_export_templates.tpz"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* "$TPL_DIR"/
          echo "Installed templates:"; ls -1 "$TPL_DIR"

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . --export-release "Web" "build/web/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
